<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: rgb(142, 156, 221);
            width: 100px;
            height:80px;
            text-align: center;

            border: 1px solid black;
            /* border: 2px dashed darkred;
            border: 2px dotted red;
            border: 2px double darkred; */
            border-radius: 15px;

            margin: 15px;
            /* margin: auto; add in center */
            padding: 15px;

            /* box-sizing: content-box; includes with + padding + margin + padding */
            box-sizing: border-box;

            border-bottom: 2px double darkred;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>Hey ppl</p>
    </div>

    <div class="box">
        <p>books</p>
    </div>
</body>
</html>
