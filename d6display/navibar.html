<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: boreder-box;
        }

        nav{
            background-color: rgb(155, 100, 100);
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2{
            color: white;
        }

            font-size: 18px;
        }

        a:hover{
            color: rgb(53, 33, 33);
            transition: 0.5s;
        }
    </style>
</head>
<body>
    <nav>
        <h2>code academy</h2>

        <div class="menu">
            <a href="#menu">home</a>
            <a href="#menu">courses</a>

</html>
