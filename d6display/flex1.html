<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .products{
            height: 500px;
            background-color: rgb(64, 33, 13);
            display: flex;
            flex-direction: row;

            justify-content: center;
            gap: 50px;
            align-items: center;

            flex-wrap: wrap;
        }

        .box{
            border: 1px solid black;
            width: 100px;
            height: 100px;
            background-color: rgb(5, 7, 56);
            color: rgb(241, 240, 255);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="products">
        <div class="box">cake</div>
        <div class="box">cookies</div>
        <div class="box">pastry</div>
    </div>
</body>
</html>
