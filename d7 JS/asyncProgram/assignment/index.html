<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Movie Info</title>
  </head>
  <body>
    <h2>Search Movie</h2>

    <input id="movieInput" placeholder="Enter movie name..." />
    <button id="searchBtn">Search</button>

    <p id="error" style="color:red;"></p>

    <h3 id="title"></h3>
    <p><b>Year:</b> <span id="year"></span></p>
    <p id="plot"></p>
    <img id="poster" alt="Movie poster" width="200" />

    <script>

        const API_KEY = "50dbd37e";

        const searchBtn = document.getElementById("searchBtn");
        const movieInput = document.getElementById("movieInput");

        const errorEl = document.getElementById("error");
        const titleEl = document.getElementById("title");
        const yearEl = document.getElementById("year");
        const plotEl = document.getElementById("plot");
        const posterEl = document.getElementById("poster");
        
        function clearUI() {
            errorEl.textContent = "";
            titleEl.textContent = "";
            yearEl.textContent = "";
            plotEl.textContent = "";
            posterEl.src = "";
            posterEl.style.display = "none";
        }
        
        async function getMovie(movieName) {
            const url = `https://www.omdbapi.com/?apikey=${API_KEY}&t=${encodeURIComponent(movieName)}`;
            
            const res = await fetch(url);
            const data = await res.json();
            return data;
        }
        
        searchBtn.addEventListener("click", async () => {
            clearUI();
            
            const movieName = movieInput.value.trim();
            if (!movieName) {
                errorEl.textContent = "Please enter a movie name.";
                return;
            }
            
            try {
                const data = await getMovie(movieName);
                
                if (data.Response === "False") {
                    errorEl.textContent = data.Error; // e.g., "Movie not found!"
                    return;
                }
                
                titleEl.textContent = data.Title;
                yearEl.textContent = data.Year;
                plotEl.textContent = data.Plot;
                
                // Poster (may be "N/A")
                if (data.Poster && data.Poster !== "N/A") {
                    posterEl.src = data.Poster;
                    posterEl.style.display = "block";
                }
            } catch (err) {
                errorEl.textContent = "Something went wrong. Try again.";
            }
            
        });

    </script>
  </body>
</html>
