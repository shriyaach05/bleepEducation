<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // draw a dice and find the lucky number
        // dice- number between 1 to 6

        let luckynum = Math.floor(Math.random() * 6) + 1
        // console.log(luckynum)


        while(true){
            // winning condition

            let guessnum = prompt("enter your num between 1 to 6:")
            if(luckynum == guessnum){
                alert("you won!")
                break;
            }
            else{
                alert("you lost! try again")
            }
        }
    </script>

</body>
</html>
