<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1. Arithmetic Operators: used to perform arithmetic operations
        let a = 10
        let b = 5
        console.log(a + b) // addition
        console.log(a - b) // subtraction
        console.log(a * b) // multiplication
        console.log(a / b) // division
        console.log(a % b) // modulus

        // 2. Assignment Operators: used to assign values to variables
        let c = 10
        c += 5 // c = c + 5
        console.log(c)
        c -= 5 // c = c - 5
        console.log(c)

        // 3. Comparison Operators: used to compare values
        let d = 10 
        let e = 5
        console.log(d == e) // equal to
        console.log(d != e) // not equal to
        console.log(d > e) // greater than
        console.log(d < e) // less than
        console.log(d >= e) // greater than or equal to
        console.log(d <= e) // less than or equal to

        console.log(d === e) // strict equal to

        // 4. Logical Operators: used to combine multiple conditions
        let isMember = true
        let TotalBill = 1000
        console.log(isMember && TotalBill > 500) // true
        console.log(isMember || TotalBill > 500) // true
        console.log(!isMember) // false
    </script>
</body>
</html>
