<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // floor() method: it will remove the decimal part of the number and return the largest integer less than or equal to the given number.

        console.log(Math.floor(4.7)); // Output: 4
        console.log(Math.floor(4.3)); // Output: 4

        // ceil() method: it will return the smallest integer greater than or equal to the given number.

        console.log(Math.ceil(3.1)); // output: 4
        console.log(Math.ceil(5.7)); // output: 6

        // round if decimal number < 0.5 --> remove decimal part and return the integer part
        console.log(Math.round(6.4)); // output: 6
        console.log(Math.round(6.5)); // output: 7
        console.log(Math.round(6.6)); // output: 7

        console.log(Math.floor(Math.random()*3)); // output: 0, 1, 2
    </script>
</body>
</html>
